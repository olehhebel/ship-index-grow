name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          output = Path("_site")
          output.mkdir(exist_ok=True)
          for name in ("index.html", "uk.html", "styles.css", "app.js",
                       "CNAME", ".nojekyll", "robots.txt", "sitemap.xml",
                       "llms.txt", "7a5a1c5ad5c5506e83a0eeccba01935a.txt"):
              shutil.copy2(name, output / name)
          for name in ("assets", "blog"):
              shutil.copytree(name, output / name, dirs_exist_ok=True)
          for name in ("index.html", "uk.html"):
              html = (output / name).read_text(encoding="utf-8")
              assert 'id="school-offer"' in html, f"Missing homepage offer in {name}"
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
