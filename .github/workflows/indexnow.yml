name: IndexNow

# Tells Bing, Yandex and other IndexNow search engines about new or updated pages
# right after the site is published on GitHub Pages. Free, no secrets needed:
# the key file 7a5a1c5ad5c5506e83a0eeccba01935a.txt in the site root proves ownership.

on:
  push:
    branches: [main]
    paths:
      - "sitemap.xml"
      - "blog/**"
      - "index.html"
      - "uk.html"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          key = "7a5a1c5ad5c5506e83a0eeccba01935a"
          host = "shipindexgrow.top"
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml", encoding="utf-8").read())
          body = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              print(res.status, f"submitted {len(urls)} URLs")
          PY
